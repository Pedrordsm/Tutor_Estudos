[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tutor-estudos"
version = "0.1.0"
description = "Módulo 4 do ecossistema \"Do diploma ao primeiro emprego\": Tutor de estudos"
requires-python = ">=3.10"
dependencies = [
    "carreira-contratos>=1.0,<2",
    "agno==3.2.0",
    "fastapi[standard]>=0.115",
    "sqlalchemy[asyncio]>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ollama = ["ollama", "openai"]
anthropic = ["anthropic"]
groq = ["groq"]
google = ["google-genai"]
testes = ["pytest", "httpx"]

[project.scripts]
tutor-estudos = "tutor_estudos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
